<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Spmb Smk 15 Jakarta</title>
</head>
<body>
    <fieldset>
        <legend>DATA AKUN SPMB PESERTA DIDIK</legend>
<P>
    <label for="Username">Masukan Username Peserta :</label>
    <input type="username" name="" id="Username" placeholder="username" autofocus>
</P>   
<p>
    <label for="Password">Masukan Password Peserta :</label>
    <input type="password" name="" id="Password" >
</p>
<p>
    <label for="Email">Email Peseta :</label>
    <input type="email" name="email" id="email" autocomplete="email">
</p>     
    </fieldset>

<fieldset>
    <legend>Formulir Pendaftaran</legend>
<p>
    <label for="Nama">Nama Lengkap Peserta Didik :</label>
    <input type="username" name="" id="Nama" disabled placeholder="RESTU IHZA PERDANA">
</p>   
    <p>Jenis Kelamin :
        <br><br>
        <label for="Laki-Laki">
            <input type="radio" name="Jenis_Kelamin" id="Laki-Laki" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Laki-laki
        
        <label for="Perempuan">
            <input type="radio" name="Jenis_Kelamin" id="Perempuan">Perempuan
        </label>
    </p> 
<p>
    <label for="Tgl lahir">Tanggal Lahir Peserta Didik :</label>
    <input type="date" name="" id="Tgl lahir">
</p>    

<p>
    <label for="Alamat">Alamat Lengkap Peserta Didik :</label>
    <input type="text" name="" id="Alamat">
</p>    
<p>
    <label for="Sidanira">Nopes Sidanira Peserta Didik :</label>
    <input type="number" name="" id="Sidanira">
</p>    
<p>
    <label for="nilai">Nilai Skl Peserta Didik :</label>
    <input type="number" name="" id="nilai">
</p>    
<P>
    <label for="Jurusan">Pilih Jurusan Sesuai Minat :</label>
    <br><br>
    <input type="radio" name="Jurusan" id="Jurusan" value="Jurusan">Rekayasa Perangkat Lunak
    <input type="radio" name="Jurusan" id="Jurusan" value="Jurusan">Manajemen Perkantoran
    <input type="radio" name="Jurusan" id="Jurusan" value="Jurusan">Akutansi
    <input type="radio" name="Jurusan" id="Jurusan" value="Jurusan">Bisnis Retail
</P>
<br>
<p>
    <label for="persetujuan">Anda Yakin Data Sudah Benar :</label>
    <input type="checkbox" name="" id="persetujuan">klik centang
</p>
<form action="">
<button type="submit" name="submit" value="submit">DAFTARKAN PESERTA DIDIK</button></form>

</fieldset>

</html>
